<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Space Subtraction Rescue</title>
    <style>
        body { background-color: #0b0b1e; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .box { max-width: 500px; margin: auto; padding: 20px; border: 3px solid #00f2ff; border-radius: 10px; background: rgba(255,255,255,0.05); }
        button { background: #ff007f; color: white; border: none; padding: 12px 24px; font-size: 18px; border-radius: 5px; cursor: pointer; margin: 10px; }
        .math { font-size: 40px; font-family: monospace; background: black; padding: 15px; width: 150px; margin: 20px auto; text-align: right; border-bottom: 4px solid white; }
        input { font-size: 30px; width: 80px; text-align: center; background: transparent; color: white; border: 2px dashed #00f2ff; }
        .block-container { display: flex; justify-content: center; gap: 30px; margin: 20px 0; }
        .rod { width: 10px; height: 50px; background: #ffcc00; display: inline-block; margin: 2px; }
        .cube { width: 10px; height: 10px; background: #00ff66; display: inline-block; margin: 2px; }
    </style>
</head>
<body>

<div class="box">
    <!-- VIEW 1: INTRO -->
    <div id="v1" style="display: block;">
        <h2>🚀 Space Rescue Academy</h2>
        <p>Alien Scrappers stole our starship fuel crystals! Let's calculate what is left.</p>
        <button onclick="document.getElementById('v1').style.display='none'; document.getElementById('v2').style.display='block'; loadMission();">Launch Mission</button>
    </div>

    <!-- VIEW 2: GAMEPLAY -->
    <div id="v2" style="display: none;">
        <h3 id="title">Sector 1</h3>
        <p id="story">Loading mission data...</p>

        <div class="block-container">
            <div><div>Tens (10s)</div><div id="t-area"></div></div>
            <div><div>Ones (1s)</div><div id="o-area"></div></div>
        </div>

        <button id="trade-btn" onclick="tradeTen()" style="background: #ffcc00; color: black; font-size: 14px;">🔄 Trade 1 Ten for 10 Ones</button>

        <div class="math">
            <div id="num1">52</div>
            <div style="border-bottom: 4px solid white;">-<span id="num2">27</span></div>
            <input type="number" id="ans" placeholder="??">
        </div>

        <p id="feed" style="font-weight: bold; min-height: 24px;"></p>
        <button onclick="verifyAnswer()">Submit Code</button>
    </div>

    <!-- VIEW 3: WIN -->
    <div id="v3" style="display: none;">
        <h2>🏆 Mission Complete!</h2>
        <p>The galaxy is safe! Excellent mathematical regrouping, Commander.</p>
        <button onclick="document.getElementById('v3').style.display='none'; document.getElementById('v1').style.display='block';">Play Again</button>
    </div>
</div>

<script>
    const data = [
        {t: "Sector 1", s: "A ship has 52 power crystals. The Scrappers take 27. How many are left?", a: 52, b: 27, r: 25},
        {t: "Sector 2", s: "You have 41 hyper-drives. A solar flare fries 18. How many work?", a: 41, b: 18, r: 23},
        {t: "Sector 3", s: "The alien shield has 63 layers. You burst 39. How many are left?", a: 63, b: 39, r: 24}
    ];

    let idx = 0, tens = 0, ones = 0, doneTrade = false;

    function loadMission() {
        let m = data[idx];
        document.getElementById("title").innerText = m.t;
        document.getElementById("story").innerText = m.s;
        document.getElementById("num1").innerText = m.a;
        document.getElementById("num2").innerText = m.b;
        document.getElementById("ans").value = "";
        document.getElementById("feed").innerText = "";
        document.getElementById("trade-btn").style.display = "inline-block";

        tens = Math.floor(m.a / 10);
        ones = m.a % 10;
        doneTrade = false;
        draw();
    }

    function draw() {
        let ta = document.getElementById("t-area"), oa = document.getElementById("o-area");
        ta.innerHTML = ""; oa.innerHTML = "";
        for(let i=0; i<tens; i++) ta.innerHTML += '<div class="rod"></div>';
        for(let i=0; i<ones; i++) oa.innerHTML += '<div class="cube"></div>';
    }

    function tradeTen() {
        if(tens > 0 && !doneTrade) {
            tens--; ones += 10; doneTrade = true;
            document.getElementById("trade-btn").style.display = "none";
            draw();
            document.getElementById("feed").style.color = "#00ff66";
            document.getElementById("feed").innerText = "⚡ Traded 1 Ten for 10 Ones!";
        }
    }

    function verifyAnswer() {
        let input = parseInt(document.getElementById("ans").value);
        let f = document.getElementById("feed");
        if(isNaN(input)) { f.style.color = "red"; f.innerText = "Please type a number."; return; }

        if(input === data[idx].r) {
            f.style.color = "#00ff66"; f.innerText = "🎯 Correct! Jumping to hyperspace...";
            setTimeout(() => {
                idx++;
                if(idx < data.length) { loadMission(); } 
                else { document.getElementById("v2").style.display = "none"; document.getElementById("v3").style.display = "block"; idx = 0; }
            }, 1500);
        } else {
            f.style.color = "red";
            f.innerText = !doneTrade ? "Try trading 1 Ten for 10 Ones first!" : "Incorrect calculation. Try again!";
        }
    }
</script>
</body>
</html>
</html>
