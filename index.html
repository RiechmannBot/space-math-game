<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Subtraction Rescue: Infinite Edition</title>
    <style>
        @keyframes moveStars {
            from { background-position: 0 0; }
            to { background-position: 0 1000px; }
        }
        body { 
            background-color: #050510; 
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px);
            background-size: 550px 550px, 350px 350px;
            animation: moveStars 30s linear infinite;
            color: white; 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            text-align: center; 
            padding: 20px;
            margin: 0;
            min-height: 95vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .box { 
            max-width: 500px; 
            width: 100%;
            margin: auto; 
            padding: 30px; 
            border: 3px solid #00f2ff; 
            border-radius: 20px; 
            background: rgba(11, 11, 30, 0.95); 
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.4);
            backdrop-filter: blur(5px);
            position: relative;
            z-index: 10;
        }
        .view-pane { display: none; }
        button { 
            background: linear-gradient(135deg, #ff007f, #b30059); 
            color: white; border: none; padding: 14px 28px; font-size: 18px; 
            font-weight: bold; border-radius: 50px; cursor: pointer; margin: 15px; 
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4); transition: transform 0.2s;
        }
        button:hover { transform: scale(1.05); box-shadow: 0 0 25px #ff007f; }
        .math { 
            font-size: 44px; font-family: monospace; font-weight: bold; background: #000; 
            padding: 20px; width: 160px; margin: 25px auto; text-align: right; border-radius: 10px;
            border: 2px solid rgba(255,255,255,0.1); box-shadow: inset 0 0 15px rgba(0,252,255,0.2); letter-spacing: 4px;
        }
        .line { border-bottom: 4px solid white; margin: 8px 0; }
        input { font-size: 34px; width: 90px; text-align: center; background: #111; color: #00f2ff; border: 2px dashed #ff007f; border-radius: 8px; }
        .block-container { display: flex; justify-content: center; gap: 40px; margin: 25px 0; }
        .block-label { font-size: 14px; color: #00f2ff; margin-bottom: 8px; }
        .rod { width: 14px; height: 65px; background: linear-gradient(#ffe600, #b3a200); border: 1px solid #fff; display: inline-block; margin: 3px; border-radius: 3px; }
        .cube { width: 14px; height: 14px; background: linear-gradient(#00ff66, #00993d); border: 1px solid #fff; display: inline-block; margin: 3px; border-radius: 3px; }
        #feed { font-size: 18px; font-weight: bold; min-height: 24px; }
        
        #reward-stage {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #020208;
            z-index: 9999;
        }
        .warp-lines {
            position: absolute; width: 100%; height: 100%;
            background-image: radial-gradient(circle, transparent 20%, #020208 70%), linear-gradient(90deg, rgba(0,242,255,0.1) 1px, transparent 1px);
            background-size: 100% 100%, 40px 100%;
            opacity: 0;
        }
        .rocket-sprite { position: absolute; left: -150px; top: 45%; width: 150px; }
        .screen-flash { position: absolute; width:100%; height:100%; background: white; opacity: 0; pointer-events: none; }
        .hud-overlay {
            position: absolute; top: 15%; left: 0; width: 100%;
            color: #00ff66; font-size: 24px; font-weight: bold; font-family: monospace;
            text-shadow: 0 0 10px #00ff66; letter-spacing: 2px;
        }

        /* Cinematic Move-Stop-Zoom Timing Sequence */
        @keyframes dynamicFly {
            0% { left: -180px; transform: scale(0.7); }
            30% { left: calc(50% - 75px); transform: scale(1.1); } /* Stop & hover in center */
            60% { left: calc(50% - 75px); transform: scale(1.1); } /* Hold positioning */
            65% { left: calc(50% - 85px); transform: scale(1.15); } /* Subtle cockpit pull back */
            100% { left: 120vw; transform: scale(1.6); } /* Mach launch off right screen */
        }

        /* Supercharged Engine Flame Thrust Scale Sequence */
        @keyframes engineThrottle {
            0% { transform: scaleX(0.5); opacity: 0.5; }
            59% { transform: scaleX(0.6); opacity: 0.7; }
            60% { transform: scaleX(3.5) scaleY(1.8); fill: #00f2ff; filter: drop-shadow(0 0 15px #00f2ff); opacity: 1; } /* Flame explodes outward */
            100% { transform: scaleX(2.5) scaleY(1.2); fill: #ff007f; filter: drop-shadow(0 0 25px #ff007f); opacity: 1; }
        }

        @keyframes warpDrive { 0% { opacity: 0; background-size: 100% 100%, 10px 100%; } 60% { opacity: 0.3; } 100% { opacity: 1; background-size: 100% 100%, 800px 100%; } }
        @keyframes flashTrigger { 0% { opacity:0; } 60% { opacity:0; } 65% { opacity:1; } 100% { opacity:0; } }

        .run-warp { animation: warpDrive 3.5s cubic-bezier(0.1, 0.8, 0.1, 1) forwards; }
        .run-rocket { animation: dynamicFly 3.5s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .run-flash { animation: flashTrigger 3.5s ease-out forwards; }
        .active-fire { animation: engineThrottle 3.5s linear infinite; transform-origin: right center; }
    </style>
</head>
<body>
<div id="reward-stage">
    <div id="flash" class="screen-flash"></div>
    <div id="warp" class="warp-lines"></div>
    <div class="hud-overlay">⚡ HYPER-DRIVE ENGAGED ⚡</div>
    <div id="rocket" class="rocket-sprite">
        <svg viewBox="0 0 120 100" width="100%">
            <!-- Flame jet linked directly to the new throttle physics -->
            <path id="booster-flame" class="active-fire" d="M25,50 L2,42 L8,50 L2,58 Z" fill="#ff007f"/>
            <path d="M25,50 L12,47 L15,50 L12,53 Z" fill="#ffcc00"/>
            <path d="M95,50 C70,62 40,62 25,50 C40,38 70,38 95,50 Z" fill="#e0e0e0" stroke="#00f2ff" stroke-width="2"/>
            <path d="M45,39 L30,20 L35,39 Z" fill="#ff007f"/>
            <path d="M45,61 L30,80 L35,61 Z" fill="#ff007f"/>
            <circle cx="70" cy="50" r="7" fill="#00f2ff"/>
        </svg>
    </div>
</div>

<div class="box">
    <div id="v1" class="view-pane" style="display: block;">
        <h1>🚀 Space Rescue</h1>
        <p>Alien Scrappers stole our fleet's power crystals! Calculate the random math codes to jump your fleet safely to hyperspace.</p>
        <button onclick="startGame()">Launch Mission</button>
    </div>

    <div id="v2" class="view-pane" style="display: none;">
        <h2 id="title" style="color: #00f2ff; margin-bottom: 5px;">Sector 1</h2>
        <p id="story" style="font-size: 14px; margin-top: 0; min-height: 40px; color: #ccc;"></p>
        <div class="block-container">
            <div><div class="block-label">Tens (10s)</div><div id="t-area"></div></div>
            <div><div class="block-label">Ones (1s)</div><div id="o-area"></div></div>
        </div>
        <button id="trade-btn" onclick="tradeTen()" style="background: linear-gradient(135deg, #ffcc00, #cc9900); color: black; font-size: 14px; padding: 8px 18px;">🔄 Trade 1 Ten for 10 Ones</button>
        <div class="math">
            <div id="num1">0</div>
            <div>-<span id="num2">0</span></div>
            <div class="line"></div>
            <input type="number" id="ans" placeholder="??">
        </div>
        <p id="feed"></p>
        <button onclick="verifyAnswer()" style="box-shadow: 0 4px 15px rgba(0, 242, 255, 0.3); background: linear-gradient(135deg, #00f2ff, #00a2ff);">Submit Core Code</button>
    </div>

    <div id="v3" class="view-pane" style="display: none;">
        <h1>🏆 Fleet Saved!</h1>
        <p>The galaxy is completely safe! Infinite configuration master path unlocked.</p>
        <button onclick="resetGame()">Play Academy Again</button>
    </div>
</div>
<script>
    let currentSector = 1;
    let topNumber = 0;
    let bottomNumber = 0;
    let correctSolution = 0;
    let tens = 0, ones = 0, doneTrade = false;

    // Dynamic story template database
    const spaceStories = [
        "A fleet scout vessel logs [A] cargo battery pods. Space marauders extract [B] pods. How many remain?",
        "Your engine panel monitors [A] ignition pins. A heavy cosmic ray bursts [B] pins offline. How many still fire?",
        "An enemy defense grid deploys [A] force shield zones. Your lasers systematically shatter [B] zones. How many zones hold?"
    ];

    function generateRandomProblem() {
        // Generate a random double-digit top number between 40 and 95
        topNumber = Math.floor(Math.random() * 56) + 40;
        
        let topOnes = topNumber % 10;
        
        // Force regrouping configuration by ensuring bottom ones place value is larger than top ones place value
        let bottomOnes = Math.floor(Math.random() * (9 - (topOnes + 1) + 1)) + (topOnes + 1);
        let bottomTens = Math.floor(Math.random() * (Math.floor(topNumber / 10) - 1)) + 1;
        
        bottomNumber = (bottomTens * 10) + bottomOnes;
        correctSolution = topNumber - bottomNumber;
    }

    function startGame() {
        currentSector = 1;
        document.getElementById('v1').style.display = 'none';
        document.getElementById('v3').style.display = 'none';
        document.getElementById('v2').style.display = 'block';
        loadMission();
    }

    function loadMission() {
        generateRandomProblem();
        
        document.getElementById("title").innerText = "Sector " + currentSector + ": Deep Reconnaissance";
        
        // Inject randomized values directly into the active story text
        let randomStoryText = spaceStories[(currentSector - 1) % spaceStories.length];
        randomStoryText = randomStoryText.replace("[A]", topNumber).replace("[B]", bottomNumber);
        document.getElementById("story").innerText = randomStoryText;
        
        document.getElementById("num1").innerText = topNumber;
        document.getElementById("num2").innerText = bottomNumber;
        document.getElementById("ans").value = "";
        document.getElementById("feed").innerText = "";
        document.getElementById("trade-btn").style.display = "inline-block";
        
        tens = Math.floor(topNumber / 10); 
        ones = topNumber % 10; 
        doneTrade = false;
        draw();
    }

    function draw() {
        let ta = document.getElementById("t-area"), oa = document.getElementById("o-area");
        ta.innerHTML = ""; oa.innerHTML = "";
        for(let i=0; i<tens; i++) ta.innerHTML += '<div class="rod"></div>';
        for(let i=0; i<ones; i++) oa.innerHTML += '<div class="cube"></div>';
    }

    function tradeTen() {
        if(tens > 0 && !doneTrade) {
            tens--; ones += 10; doneTrade = true;
            document.getElementById("trade-btn").style.display = "none";
            draw();
            let f = document.getElementById("feed"); f.style.color = "#00ff66"; f.innerText = "⚡ ENERGY SURGE! 1 Ten split into 10 Ones!";
        }
    }

    function playRewardAnimation(callback) {
        const stage = document.getElementById('reward-stage');
        const flash = document.getElementById('flash');
        const warp = document.getElementById('warp');
        const rocket = document.getElementById('rocket');

        stage.style.display = 'block';
        flash.className = 'screen-flash run-flash';
        warp.className = 'warp-lines run-warp';
        rocket.className = 'rocket-sprite run-rocket';

        // Keep stage alive slightly longer (3.5s) to allow for hover and blast phase
        setTimeout(() => {
            stage.style.display = 'none';
            flash.className = 'screen-flash';
            warp.className = 'warp-lines';
            rocket.className = 'rocket-sprite';
            callback();
        }, 3500);
    }

    function verifyAnswer() {
        let input = parseInt(document.getElementById("ans").value);
        let f = document.getElementById("feed");
        if(isNaN(input)) { f.style.color = "#ff3333"; f.innerText = "⚠️ Input a numerical navigation code."; return; }

        if(input === correctSolution) {
            f.style.color = "#00ff66"; f.innerText = "🎯 COORDINATES LOCKED! Preparing jump...";
            setTimeout(() => {
                playRewardAnimation(() => {
                    currentSector++;
                    if(currentSector <= 3) { loadMission(); } 
                    else { document.getElementById("v2").style.display = "none"; document.getElementById("v3").style.display = "block"; }
                });
            }, 800);
        } else {
            f.style.color = "#ff3333";
            f.innerText = !doneTrade ? "❌ Shield failure! Try trading 1 Ten next door to get more Ones cubes!" : "❌ Recalibrating coordinates... Try counting the cubes again!";
        }
    }

    function resetGame() {
        document.getElementById('v3').style.display = 'none';
        document.getElementById('v2').style.display = 'none';
        document.getElementById('v1').style.display = 'block';
    }
</script>
</body>
</html>
